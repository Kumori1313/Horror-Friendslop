<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#141b1a">
  <title>Relay Room · Co-op test</title>
</head>
<body>
  <main>
    <canvas id="scene" aria-label="First-person view of the relay room"></canvas>
    <header><div><span class="lamp-icon" aria-hidden="true">◈</span> RELAY ROOM</div><span id="connection" role="status">Connecting…</span></header>
    <section id="brief">
      <p class="eyebrow">Local co-op test</p>
      <h1>Relay Room</h1>
      <p>Meet at the yellow line. Carry the inspection light through the doorway and pass it to your partner.</p>
      <button id="enter" disabled>Enter room</button>
      <p class="hint">WASD to walk · Mouse or arrows to look</p>
    </section>
    <div id="reticle" hidden></div>
    <aside id="diagnostics" hidden><h2>Room diagnostics</h2><pre id="stats"></pre></aside>
    <footer><span id="action">Waiting for room</span><button id="debug" aria-expanded="false">Diagnostics · G</button></footer>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
